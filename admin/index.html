<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin | Suravkar Jewels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<main class="wrap narrow">

  <!-- Sign in -->
  <section id="login" hidden>
    <h1>Shop admin</h1>
    <p class="muted">Sign in to manage Suravkar Jewels.</p>
    <form id="loginForm" class="stack">
      <label>Email<input id="l_email" type="email" autocomplete="username" required></label>
      <label>Password<input id="l_pass" type="password" autocomplete="current-password" required></label>
      <p id="loginErr" class="err" role="alert"></p>
      <button class="btn primary" id="loginBtn" type="submit">Sign in</button>
    </form>
  </section>

  <!-- Not approved -->
  <section id="denied" hidden>
    <h1>Not allowed</h1>
    <p class="muted">This account is not approved to manage the shop.</p>
    <button class="btn" id="deniedOut" type="button">Sign out</button>
  </section>

  <!-- Product list -->
  <section id="list" hidden>
    <div class="top">
      <h1>Products</h1>
      <button class="btn small" id="outBtn" type="button">Sign out</button>
    </div>
    <button class="btn primary big" id="addBtn" type="button">+ Add new product</button>
    <p class="muted" id="count"></p>
    <div id="items" class="stack"></div>
  </section>

  <!-- Add / edit -->
  <section id="editor" hidden>
    <div class="top">
      <h1 id="edTitle">Add new product</h1>
      <button class="btn small" id="cancelBtn" type="button">Cancel</button>
    </div>
    <div class="stack">
      <div class="photo">
        <img id="f_prev" alt="" hidden>
        <label class="btn big photobtn" for="f_photo" id="photoLabel">Take or choose photo</label>
        <input id="f_photo" type="file" accept="image/*" hidden>
      </div>
      <label>Product name<input id="f_name" type="text" maxlength="80" placeholder="e.g. Gold Jhumka"></label>
      <label>Price (₹)<input id="f_price" type="number" inputmode="numeric" min="0" step="1" placeholder="e.g. 250"></label>
      <label>Category
        <select id="f_cat">
          <option value="">Choose category</option>
          <option>Earrings</option><option>Bangles</option><option>Necklaces</option><option>Rings</option>
        </select>
      </label>
      <label class="check"><input id="f_new" type="checkbox"> Show in New Arrivals</label>
      <label class="check"><input id="f_stock" type="checkbox" checked> Available in shop</label>
      <button class="btn primary big" id="saveBtn" type="button">Publish</button>
    </div>
  </section>

</main>
<div id="toast" class="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/compress.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
